name: Release

# Publishes to npm with provenance when a semver tag (v1.2.3) is pushed.
# Uses npm trusted publishing (OIDC): no npm token is stored anywhere. The package's
# npm settings must list this repository and workflow (release.yml) as a trusted publisher.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5.1+
      - run: npm ci
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:package
      - run: npm run test:workerd
      - run: npm publish --provenance --access public
